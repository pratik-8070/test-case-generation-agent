openapi: 3.0.3
info:
  title: ShopEase Orders API
  version: 1.2.0
servers:
  - url: https://api.shopease.example/v1
security:
  - bearerAuth: []
paths:
  /orders:
    post:
      summary: Create an order from the caller's cart items
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created. Stock is reserved for each item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
        '409':
          description: One or more items are out of stock; no order is created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{orderId}:
    get:
      summary: Get an order by id
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Missing or invalid bearer token
        '404':
          description: Order not found, or it belongs to another customer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CreateOrderRequest:
      type: object
      required: [items, shippingAddressId]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                maximum: 10
        shippingAddressId:
          type: string
          format: uuid
        couponCode:
          type: string
          pattern: '^[A-Z0-9]{6,12}$'
    Order:
      type: object
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, PAID, SHIPPED, CANCELLED]}
        items:
          type: array
          items:
            type: object
            properties:
              productId: {type: string, format: uuid}
              quantity: {type: integer}
              unitPrice: {type: number}
        total: {type: number}
        createdAt: {type: string, format: date-time}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        field: {type: string}
